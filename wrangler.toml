name = "babello-proxy"
main = "index.ts"
compatibility_date = "2026-09-08"

# No `routes`, on purpose: a custom domain has to be one the deployer owns, so listing
# any here would fail every fork and every Deploy to Cloudflare button, and the proxy
# is reached at its workers.dev address instead. To serve it from your own domain, add
# `routes` to a `wrangler.local.toml` (gitignored) and deploy with `-c wrangler.local.toml`.

# No KV, no R2, no Durable Objects, no cache: this thing holds nothing. It pipes
# `upstream.body` straight into the Response, so the bytes never enter the isolate
# and a 26MB slice costs the same CPU as a 200-byte one — which is what keeps it
# inside the free plan's 10ms CPU budget.
